name: Build Unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-for-testing:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Generate Xcode Project
        run: |
          command -v xcodegen >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          xcodegen generate
      - name: Build For Testing
        run: |
          IPHONE_ID=$(xcrun simctl list devices available iPhone -j | python3 -c "import sys,json; d=json.load(sys.stdin)['devices']; c=[x['udid'] for k,v in sorted(d.items(), reverse=True) for x in v if x.get('isAvailable')]; print(c[0])")
          xcodebuild build-for-testing \
            -project "Agar.io.xcodeproj" \
            -scheme "Agar.io" \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            -destination "platform=iOS Simulator,id=$IPHONE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Save DerivedData for Parallel Test Jobs
        uses: actions/cache/save@v4
        with:
          path: build/DerivedData
          key: dd-${{ github.run_id }}-${{ github.run_attempt }}

  parity-tests:
    needs: build-for-testing
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Restore DerivedData
        uses: actions/cache/restore@v4
        with:
          path: build/DerivedData
          key: dd-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Generate Xcode Project
        run: |
          command -v xcodegen >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          xcodegen generate
      - name: Run AgarParityTests (iPhone Simulator)
        run: |
          set -o pipefail
          mkdir -p /tmp/agar_snapshots build/snapshots
          IPHONE_ID=$(xcrun simctl list devices available iPhone -j | python3 -c "import sys,json; d=json.load(sys.stdin)['devices']; c=[x['udid'] for k,v in sorted(d.items(), reverse=True) for x in v if x.get('isAvailable')]; print(c[0])")
          xcrun simctl boot "$IPHONE_ID" || true
          TEST_RUNNER_AGAR_SNAPSHOT_DIR=/tmp/agar_snapshots xcodebuild test-without-building \
            -project "Agar.io.xcodeproj" \
            -scheme "Agar.io" \
            -derivedDataPath build/DerivedData \
            -destination "platform=iOS Simulator,id=$IPHONE_ID" \
            -only-testing:AgarParityTests \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -resultBundlePath build/TestResults_Parity.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" | tee build/xctest_parity.log
          cp -R /tmp/agar_snapshots/* build/snapshots/ 2>/dev/null || true
          xcrun xcresulttool export attachments --path build/TestResults_Parity.xcresult --output-path build/snapshots/xcresult_parity_attachments 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ParitySnapshots-and-Logs
          path: |
            build/xctest_parity.log
            build/snapshots/

  ui-tests-iphone:
    needs: build-for-testing
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Restore DerivedData
        uses: actions/cache/restore@v4
        with:
          path: build/DerivedData
          key: dd-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Generate Xcode Project
        run: |
          command -v xcodegen >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          xcodegen generate
      - name: Run AgarUITests (iPhone Simulator)
        run: |
          set -o pipefail
          mkdir -p build/snapshots_iphone
          IPHONE_ID=$(xcrun simctl list devices available iPhone -j | python3 -c "import sys,json; d=json.load(sys.stdin)['devices']; c=[x['udid'] for k,v in sorted(d.items(), reverse=True) for x in v if x.get('isAvailable')]; print(c[0])")
          xcrun simctl boot "$IPHONE_ID" || true
          xcodebuild test-without-building \
            -project "Agar.io.xcodeproj" \
            -scheme "Agar.io" \
            -derivedDataPath build/DerivedData \
            -destination "platform=iOS Simulator,id=$IPHONE_ID" \
            -only-testing:AgarUITests \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 240 \
            -resultBundlePath build/TestResults_iPhone.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" | tee build/xctest_iphone.log
          xcrun xcresulttool export attachments --path build/TestResults_iPhone.xcresult --output-path build/snapshots_iphone/xcresult_iphone_attachments 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iPhone-UITests-Snapshots
          path: |
            build/xctest_iphone.log
            build/snapshots_iphone/

  ui-tests-ipad:
    needs: build-for-testing
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Restore DerivedData
        uses: actions/cache/restore@v4
        with:
          path: build/DerivedData
          key: dd-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Generate Xcode Project
        run: |
          command -v xcodegen >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          xcodegen generate
      - name: Run AgarUITests (iPad Simulator)
        run: |
          set -o pipefail
          mkdir -p build/snapshots_ipad
          IPAD_ID=$(xcrun simctl list devices available iPad -j | python3 -c "import sys,json; d=json.load(sys.stdin)['devices']; c=[x['udid'] for k,v in sorted(d.items(), reverse=True) for x in v if x.get('isAvailable')]; print(c[0])")
          xcrun simctl boot "$IPAD_ID" || true
          xcrun simctl bootstatus "$IPAD_ID" -b || true
          xcodebuild test-without-building \
            -project "Agar.io.xcodeproj" \
            -scheme "Agar.io" \
            -derivedDataPath build/DerivedData \
            -destination "platform=iOS Simulator,id=$IPAD_ID" \
            -only-testing:AgarUITests \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 240 \
            -resultBundlePath build/TestResults_iPad.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" | tee build/xctest_ipad.log
          xcrun xcresulttool export attachments --path build/TestResults_iPad.xcresult --output-path build/snapshots_ipad/xcresult_ipad_attachments 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iPad-UITests-Snapshots
          path: |
            build/xctest_ipad.log
            build/snapshots_ipad/

  archive-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Generate Xcode Project
        run: |
          command -v xcodegen >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          xcodegen generate
      - name: Archive iOS App
        run: |
          xcodebuild archive \
            -project "Agar.io.xcodeproj" \
            -scheme "Agar.io" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Agar.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Agar.xcarchive -name "*.app" -type d | head -n 1)
          test -n "$APP_PATH"
          cp -R "$APP_PATH" Payload/
          APP_NAME=$(basename "$APP_PATH")
          PLIST="Payload/$APP_NAME/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :AgarBuildSHA string ${GITHUB_SHA:0:7}" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :AgarBuildSHA ${GITHUB_SHA:0:7}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :AgarBuildDate string $(date -u +%Y-%m-%dT%H:%MZ)" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :AgarBuildDate $(date -u +%Y-%m-%dT%H:%MZ)" "$PLIST"
          zip -r -y AgarioSkins-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: AgarioSkins-unsigned-ipa
          path: AgarioSkins-unsigned.ipa
