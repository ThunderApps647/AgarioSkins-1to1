name: Agar.io
options:
  bundleIdPrefix: com.agario
  deploymentTarget:
    iOS: "18.1"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_UPCOMING_FEATURE_BARE_SLASH_REGEX_LITERALS: YES
targets:
  Agar.io:
    type: application
    platform: iOS
    deploymentTarget: "18.1"
    sources:
      - path: .
        excludes:
          - ".github/**"
          - ".swiftpm/**"
          - "Package.swift"
          - "project.yml"
          - "Resources/extracted-images-1766733943703.zip"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agario.recreation
        PRODUCT_NAME: "Agar.io"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Agar.io"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Server"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    info:
      path: Info.plist
      properties:
        NSBonjourServices:
          - _http._tcp
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIAppFonts:
          - Lato-Regular.ttf
          - lato-heavy.ttf
          - Ubuntu-Bold.ttf
          - Ubuntu-Medium.ttf
          - Ubuntu-Semibold.ttf
          - UbuntuSans-Bold.ttf
